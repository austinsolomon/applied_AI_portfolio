[project]
name = "leadgen"
version = "0.1.0"
description = "Lead-gen agent on the Claude Agent SDK: demand gaps → sourcing → dedupe → enrichment → qualification → CRM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
leadgen = "leadgen:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
