[project]
name = "leadgen"
version = "0.1.0"
description = "Lead-gen agent on the Claude Agent SDK: demand gaps → sourcing → dedupe → enrichment → qualification → CRM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.65.0",
]

[project.scripts]
leadgen = "leadgen.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.22",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings · F: pyflakes (real bugs) · I: import order
# B: bugbear (likely bugs) · UP: pyupgrade (modern syntax for the target Python)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
