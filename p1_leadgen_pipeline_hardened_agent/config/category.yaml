# The one category this deployment sources. Changed by pull request, never at runtime.
# Demo category: independent private and personal chefs in US markets, not restaurant chefs.

name: private_chef
label: Independent private and personal chefs

# Google Maps search terms, strongest first. The planner reorders them by the purity each one
# produced in past samples once that history exists.
keywords:
  - private chef
  - personal chef
  - in-home chef
  - personal chef service
  - meal prep chef
  - private dinner chef

# Exa sourcing: plain-language descriptions of the businesses wanted, as Exa's search guide
# recommends ("describe the pages you want, not a bag of keywords"). Each is run once per planned
# city; a business found by several phrasings ranks higher (query_consensus).
exa_queries:
  - independent private chefs who cook in clients' homes in {city}, personal chef business homepages
  - personal chef services offering in-home meal prep and private dinners in {city}
  - hire a private chef for dinner parties and weekly meal prep in {city}, the chef's own website

# Words that mark a page title or domain as this category. An Exa result needs one of them.
signal_terms:
  - chef
  - culinary

# The Maps sample grader counts a business as on-category when one of its Maps categories
# contains a term from `maps_category_terms` and none from `maps_category_excludes`.
maps_category_terms:
  - chef
maps_category_excludes:
  - restaurant
  - school
  - caterer

# Evidence gathering during qualification. `{business}` and `{market}` are filled in per lead.
# The site search runs on the business's own domain; the web search looks for third-party pages.
site_search: "{business}: private chef services, where they cook, and any restaurant they work at"
evidence_search: "{business} {market} private chef personal chef"

# Added to the judge's instructions: what the evidence must show before a lead can qualify.
judge_requirement: >
  Require affirmative evidence that this is a private or personal chef who currently cooks for
  clients (in homes, rentals or private events) and serves the market. A current restaurant,
  restaurant group, catering company or meal-delivery affiliation means rejected. Past restaurant
  experience in a biography does not disqualify. Mixed or unclear affiliation means review.

# Share of raw leads expected to qualify. The planner sizes a plan as goal ÷ this rate.
expected_qualification_rate: 0.30

# The eligibility rubric the sample grader and the qualification judge read.
rubric:
  qualified_when: >
    An individual private or personal chef, or a small chef-led business, that currently cooks
    for clients in their homes, vacation rentals or private events (in-home dinners, weekly meal
    prep, private dining) and is not currently employed by, owning or cooking for a restaurant.
    Past restaurant experience mentioned in a biography is fine.
  rejected_when: >
    A restaurant or restaurant group; a chef who currently works at or owns a restaurant; a
    restaurant's catering arm; a catering company; a ghost kitchen, meal-kit or meal-delivery
    business; a food truck; a cooking school or class venue; or a chef marketplace or directory.
  review_when: >
    The pages do not say whether the chef is independent today, the business mixes private-chef
    work with restaurant or catering work (for example "private chef and catering"), or it is
    unclear whether the chef cooks for private clients.
  eligible_services:
    - private chef
    - personal chef
    - in-home dinner
    - weekly meal prep
    - private dinner party
    - vacation rental chef
    - private event chef

# Phrases that, affirmed in a qualification reason, describe a business the rubric rejects. The
# CRM write flags a qualified lead whose reason affirms one ("works at a restaurant"); negated
# mentions ("is not affiliated with a restaurant") do not count.
disqualifier_phrases:
  - works at a restaurant
  - owns a restaurant
  - restaurant group
  - restaurant's catering
  - catering company
  - meal delivery
  - meal-kit
  - ghost kitchen
  - food truck
  - cooking school
  - chef marketplace
  - business directory
  - online directory

# Domains many unrelated businesses share: social profiles, link-in-bio pages and site builders
# that put every business under one host. Dedupe never treats these as a match key, and
# Exa sourcing excludes them in the request itself. A host entry also covers its subdomains, so list
# a host only when its subdomains are not individual businesses either.
shared_hosts:
  - facebook.com
  - fb.com
  - instagram.com
  - linktr.ee
  - linkin.bio
  - beacons.ai
  - tiktok.com
  - youtube.com
  - twitter.com
  - x.com
  - pinterest.com
  - sites.google.com
  - google.com
  - goo.gl
  - bit.ly
  - carrd.co
  - about.me
  - calendly.com
  - linkedin.com

# Directories, review sites and booking marketplaces. Their pages describe many businesses, so
# a result on one of these hosts is never a lead. They are also
# excluded from the domain match key, for the same reason as the shared hosts.
aggregator_hosts:
  # Directories and review sites: their pages describe many businesses.
  - yelp.com
  - yellowpages.com
  - tripadvisor.com
  - mapquest.com
  - bbb.org
  - manta.com
  - foursquare.com
  - nextdoor.com
  # Hiring and gig marketplaces that list many chefs under one host.
  - thumbtack.com
  - angi.com
  - bark.com
  - care.com
  - takeachef.com
  - cozymeal.com
  # Restaurant reservation, delivery and event platforms: never an independent chef's own site.
  - opentable.com
  - resy.com
  - doordash.com
  - ubereats.com
  - grubhub.com
  - eventbrite.com
  - theknot.com
  - weddingwire.com
