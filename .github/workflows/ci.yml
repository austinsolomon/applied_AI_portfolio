name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: no step in this workflow can push code or change the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1:
    name: p1 lead-gen agent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: p1_leadgen_pipeline_hardened_agent
    steps:
      # Third-party actions are pinned to commit SHAs (tags can be moved); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the secret scan
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: p1_leadgen_pipeline_hardened_agent/uv.lock

      - name: Install from the lockfile (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Commit checks (the same hooks that run locally)
        working-directory: .
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

      - name: Secret scan of the full git history
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose

      - name: Tests
        run: uv run pytest
