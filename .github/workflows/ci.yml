name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: no step in this workflow can push code or change the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1:
    name: p1 lead-gen agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: p1_leadgen_pipeline_hardened_agent
    # Same Postgres version as compose.yaml. CI-only credentials for a database that lives for one job.
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: leadgen
          POSTGRES_PASSWORD: leadgen_ci
          POSTGRES_DB: leadgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadgen -d leadgen"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://leadgen:leadgen_ci@localhost:5432/leadgen
    steps:
      # Third-party actions are pinned to commit SHAs (tags can be moved); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the secret scan
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: p1_leadgen_pipeline_hardened_agent/uv.lock

      - name: Install from the lockfile (fails if uv.lock is out of date)
        run: uv sync --locked

      # The gitleaks hook is skipped here because the next step scans the full history with the same
      # gitleaks version. The hook would otherwise compile gitleaks from source on every run, which
      # depends on downloading a Go toolchain and has failed on network timeouts.
      - name: Commit checks (the same hooks that run locally, except gitleaks)
        working-directory: .
        env:
          SKIP: gitleaks
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

      - name: Secret scan of the full git history
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose

      - name: Migrations apply cleanly
        run: uv run leadgen db migrate

      - name: Architecture maps are valid and up to date
        run: node docs/architecture/atlas/build.mjs --check

      - name: Tests
        run: uv run pytest

      # The same image that runs in the cloud: package from the lockfile plus the Claude Code CLI.
      - name: Container image builds and runs
        run: |
          docker build --tag leadgen:ci .
          docker run --rm leadgen:ci --version
          docker run --rm --entrypoint claude leadgen:ci --version

      # Migrations ship inside the package: prove it by migrating a fresh database from the image,
      # not from the checkout. The service container's port is published on the runner's localhost.
      - name: Container image applies migrations to a fresh database
        run: |
          docker run --rm --network host postgres:16.14 \
            psql "$DATABASE_URL" -c "CREATE DATABASE leadgen_image"
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://leadgen:leadgen_ci@localhost:5432/leadgen_image" \
            leadgen:ci db migrate
