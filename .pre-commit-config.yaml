# Runs on every `git commit` after a one-time `pre-commit install`.
# CI runs the same checks, so these hooks are early feedback, not the enforcement point.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Imported unchanged from its original repository (no final newline in one test file).
        exclude: ^past_builds/semi-automated-leadgen-skills/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ruff runs through `uv run`, so the hook uses the exact version pinned in the project's uv.lock.
  - repo: local
    hooks:
      - id: ruff-check-p1
        name: ruff check (past_builds/leadgen_pipeline_agents)
        entry: uv run --project past_builds/leadgen_pipeline_agents ruff check --fix
        language: system
        types: [python]
        files: ^past_builds/leadgen_pipeline_agents/
      - id: ruff-format-p1
        name: ruff format (past_builds/leadgen_pipeline_agents)
        entry: uv run --project past_builds/leadgen_pipeline_agents ruff format
        language: system
        types: [python]
        files: ^past_builds/leadgen_pipeline_agents/
